<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manual do Humano — Dossiê Confidencial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+SC:wght@600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0b1220;
    --navy2:#111a2e;
    --gold:#c9a227;
    --gold-dim:#8a7020;
    --cream:#ede6d3;
    --cream-dim:#b8b09a;
    --red:#8f2c22;
    --red-bright:#b23a2e;
    --line: rgba(201,162,39,0.25);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background-color:var(--navy);
    background-image:
      linear-gradient(rgba(11,18,32,0.90), rgba(11,18,32,0.94)),
      url('https://gatocorona.com.br/colagem_bg2.jpg');
    background-size: cover;
    background-position: center top;
    background-attachment: fixed;
    background-repeat: no-repeat;
    color:var(--cream);
    font-family:'EB Garamond', serif;
    font-size:19px;
    line-height:1.6;
    overflow-x:hidden;
  }
  .mono{font-family:'IBM Plex Mono', monospace; letter-spacing:0.06em;}
  h1,h2,h3{font-family:'Cormorant SC', serif; font-weight:700; letter-spacing:0.02em;}
  a{color:inherit;}
  .wrap{max-width:920px; margin:0 auto; padding:0 28px;}
  ::selection{background:var(--gold); color:var(--navy);}

  /* texture */
  body::before{
    content:"";
    position:fixed; inset:0;
    background-image:
      repeating-linear-gradient(0deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 3px);
    pointer-events:none;
    z-index:1;
  }

  /* ---- top bar ---- */
  .topbar{
    position:sticky; top:0; z-index:50;
    background:rgba(11,18,32,0.92);
    backdrop-filter: blur(6px);
    border-bottom:1px solid var(--line);
    padding:14px 0;
  }
  .topbar .wrap{display:flex; align-items:center; justify-content:space-between;}
  .topbar .brand{font-family:'Cormorant SC'; font-weight:700; font-size:20px; color:var(--gold);}
  .topbar .file-id{font-size:11px; color:var(--cream-dim); font-family:'IBM Plex Mono';}

  /* ---- hero ---- */
  .hero{
    position:relative;
    padding:90px 0 70px;
    text-align:center;
    border-bottom:1px solid var(--line);
  }
  .stamp{
    display:inline-block;
    border:3px solid var(--red-bright);
